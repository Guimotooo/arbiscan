name: ArbiiScan - desplegar suscripciones Telegram
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/desplegar_worker_suscriptores.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b05ff8a74cdaf17a4fcf034e4832fa63
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuración requerida sin revelar secretos
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Desplegar Worker preservando variables y secretos
        run: npx --yes wrangler@4 deploy --config worker/wrangler.toml --keep-vars
      - name: Comprobar Worker en producción
        run: |
          curl --fail --silent --show-error https://arbiscan.dame-un-like-porfavor.workers.dev/health
