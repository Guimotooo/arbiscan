name: ArbiiScan - busqueda automatica de arbitrajes ES
on:
  workflow_dispatch:
  # Enviar candidatos cuando existan; sin avisos ficticios ni solicitud al usuario.
  push:
    branches: [main]
    paths:
      - 'fuentes_es/oddspapi_multisport.py'
      - 'fuentes_es/scan_status.py'
      - 'test_scan_status.py'
      - '.github/workflows/escaner_multisport.yml'
  # Dos rondas diarias con la cuota gratuita: 07:15 y 18:15 UTC.
  schedule:
    - cron: '15 7,18 * * *'
permissions:
  contents: read
concurrency:
  group: arbi-multisport
  cancel-in-progress: false
jobs:
  test_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar mercados y arbitrajes 4 deportes
        run: python -m unittest -v test_oddspapi_multisport.py
      - name: Validar publicación del estado de escaneo
        run: python -m unittest -v test_scan_status.py
      - name: Evaluar proveedor real con la cuota gratuita
        env:
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
          ODDSPAPI_ENABLE_ALERTS: 'true'
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ARBI_WORKER_URL: https://arbiscan.dame-un-like-porfavor.workers.dev
        run: python -m fuentes_es.oddspapi_multisport
      - name: Confirmar registro del escaneo en Cloudflare
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from datetime import datetime,timezone
          secret=os.getenv("WEBHOOK_SECRET","").strip()
          if not secret:
              raise SystemExit("No hay secreto para verificar el estado")
          req=Request("https://arbiscan.dame-un-like-porfavor.workers.dev/scan-status",
            headers={"Authorization":"Bearer "+secret,"User-Agent":"curl/8.5.0","Accept":"application/json"})
          with urlopen(req,timeout=15) as res:
              state=json.load(res)
          assert state.get("source")=="OddsPapi", "No se guardó el estado real"
          assert state.get("state") in ("finished","skipped"), "Escaneo sin resultado final"
          t=datetime.fromisoformat(state["checked_at"].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-t).total_seconds()
          assert -10<=age<=180, "Estado antiguo o no verificable"
          print("Estado comprobado:",state["state"],"Partidos:",state["fixture_count"],"Candidatos:",state["candidates"])
          PY
