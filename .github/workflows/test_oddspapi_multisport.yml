name: ArbiiScan - validar combinaciones de 4 deportes
on:
  workflow_dispatch:
  push:
    paths:
      - 'fuentes_es/oddspapi_multisport.py'
      - 'test_oddspapi_multisport.py'
      - '.github/workflows/test_oddspapi_multisport.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probar comparacion multioperador sin gastar solicitudes
        run: python -m unittest -v test_oddspapi_multisport.py
