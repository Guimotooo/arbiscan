name: ArbiiScan - diagnostico webhook
on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/arbiscan.mjs'
      - '.github/workflows/diagnosticar_webhook.yml'
      - 'scripts/diagnosticar_webhook.py'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar estado real de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/diagnosticar_webhook.py
