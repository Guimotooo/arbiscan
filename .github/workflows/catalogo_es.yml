name: ArbiiScan - descubrir todas casas ES en OddsPapi
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalogo_es.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Identificar bookmakers espanoles reales
        env:
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
        run: python -m fuentes_es.catalogo_es
