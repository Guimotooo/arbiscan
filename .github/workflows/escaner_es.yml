name: ArbiiScan - escaner Bet365 ES y Winamax ES
on:
  workflow_dispatch:
  push:
    paths:
      - 'fuentes_es/oddspapi.py'
      - 'test_oddspapi.py'
      - '.github/workflows/escaner_es.yml'
permissions:
  contents: read
concurrency:
  group: arbi-oddspapi
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar seguridad de cuotas españolas
        run: python -m unittest -v test_oddspapi.py
      - name: Consultar API y calcular candidatos
        env:
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
          ODDSPAPI_ENABLE_ALERTS: 'true'
          ODDSPAPI_TOURNAMENT_IDS: ${{ vars.ODDSPAPI_TOURNAMENT_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ARBI_WORKER_URL: https://arbiscan.dame-un-like-porfavor.workers.dev
        run: python -m fuentes_es.oddspapi
