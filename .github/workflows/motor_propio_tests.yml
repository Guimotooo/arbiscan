name: ArbiiScan - pruebas motor propio de cuotas
on:
  workflow_dispatch:
  push:
    paths:
      - 'motor_propio/**'
      - 'test_motor_propio.py'
      - '.github/workflows/motor_propio_tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias del parser HTML
        run: python -m pip install 'scrapling>=0.5,<0.6'
      - name: Comprobar cuotas, mercados, arbitrajes, selectores y seguridad
        run: python -m unittest -v test_motor_propio.py
