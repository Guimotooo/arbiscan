name: ArbiiScan - diagnostico Scrapling Winamax
on:
  workflow_dispatch:
  push:
    paths:
      - 'scraping_es/scrapling_probe.py'
      - '.github/workflows/diagnostico_scrapling.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Scrapling
        run: python -m pip install 'scrapling[fetchers]'
      - name: Instalar navegador Chromium para JS
        run: python -m playwright install --with-deps chromium
      - name: Consultar Winamax con navegador dinamico Scrapling sin evasion
        env:
          SCRAPLING_PROBE_MODE: dynamic
        run: python -m scraping_es.scrapling_probe
